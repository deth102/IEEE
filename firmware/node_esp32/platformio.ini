; The complete KESTREL node (features, both heads, self-check gate, on-chip update, run-time forest refresh),
; driven over USB serial by the host that plays the gateway (03_code/tools/node_host.py).
; Wiring: jumper GPIO25 (DAC1) -> GPIO34 (ADC1_CH6) for the analog loop.
;   pio run -e node_kaist -t upload     KAIST build (N = 8192, fs = 25.6 kHz, F19)
;   pio run -e node_cwru  -t upload     CWRU build (N = 8192, fs = 48 kHz, F22 with the bearing-order stage)
[platformio]
default_envs = node_kaist

[env]
platform = espressif32@6.9.0      ; Arduino-ESP32 2.0.17 on ESP-IDF 4.4, as for the measurements in the paper
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
board_build.partitions = huge_app.csv
lib_extra_dirs = ${PROJECT_DIR}/../lib
build_unflags = -Os
build_flags = -O2 -DFD_TABLES_IN_RAM -DNODE_BAUD=921600   ; the CH340 bridge does not pass 2 Mbaud

[env:node_kaist]
build_flags = ${env.build_flags} -I"$PROJECT_DIR/../models/kaist_n8192"

[env:node_cwru]
build_flags = ${env.build_flags} -I"$PROJECT_DIR/../models/cwru_n8192_env"
