; Benchmark of fdcore on several MCUs. The model under test is the one copied into
; ../models/active/ by `python -m tools.select_model <tag>` (done automatically by e13).
;
;   pio run -e esp32dev -t upload -t monitor
;
[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ${PROJECT_DIR}/../lib
build_flags =
    -O2
    -I"$PROJECT_DIR/../models/active"
build_unflags = -Os

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:esp32dev_ramtables]
; same board, FFT/Hamming tables placed in DRAM instead of flash
platform = espressif32
board = esp32dev
build_flags = ${env.build_flags} -DFD_TABLES_IN_RAM

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1

[env:nucleo_f446re]
platform = ststm32
board = nucleo_f446re
; 128 KiB SRAM: the legacy pipeline (112 KiB of buffers) does not fit next to the optimized one
build_flags = ${env.build_flags} -DFD_BENCH_LEGACY=0

[env:nucleo_h743zi]
platform = ststm32
board = nucleo_h743zi

[env:pico]
platform = raspberrypi
board = pico
build_flags = ${env.build_flags} -DFD_BENCH_REPS=2
