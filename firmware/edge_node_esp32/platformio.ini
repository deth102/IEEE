; Real-time edge node (ESP32 + microSD + LCD 20x4 I2C), hardware-in-the-loop streaming.
; Select the model first:  python -m tools.select_model kaist_n8192
; Build / flash / monitor: pio run -t upload -t monitor
[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ${PROJECT_DIR}/../lib
lib_deps = marcoschwartz/LiquidCrystal_I2C
build_flags =
    -O2
    -I"$PROJECT_DIR/../models/active"
build_unflags = -Os

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1
