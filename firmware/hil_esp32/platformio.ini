; Hardware-in-the-loop validation on an ESP32 DevKit (NodeMCU-32S compatible).
; Wiring: jumper GPIO25 (DAC1) -> GPIO34 (ADC1_CH6).
; Signal set: python -m tools.make_hil_data   (writes include/hil_data.h, ~2.2 MB in flash)
;   pio run -e hil_clean -t upload     model trained on clean data
;   pio run -e hil_aug   -t upload     model trained with noise augmentation
[platformio]
default_envs = hil_clean

[env]
platform = espressif32@6.9.0      ; Arduino-ESP32 2.0.17 on ESP-IDF 4.4 (newer platforms move to IDF 5 / Arduino 3)
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_extra_dirs = ${PROJECT_DIR}/../lib
build_unflags = -Os
build_flags = -O2 -DFD_TABLES_IN_RAM

[env:hil_clean]
build_flags = ${env.build_flags} -I"$PROJECT_DIR/../models/kaist_n8192"

[env:hil_aug]
build_flags = ${env.build_flags} -I"$PROJECT_DIR/../models/kaist_n8192_aug" -DHIL_MODEL_AUG=1
